[build]
  publish = "."
  functions = "netlify/functions"

# Każda znana trasa API jest mapowana jawnie do jednej funkcji serverless.
# Nie używamy :splat w query stringu, bo Netlify nie wspiera takiego podstawienia.

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/api?route=news"
  status = 200
  force = true

[[redirects]]
  from = "/api/audit"
  to = "/.netlify/functions/api?route=audit"
  status = 200
  force = true

